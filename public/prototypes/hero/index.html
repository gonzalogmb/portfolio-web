<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipos — Hero (ronda 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------
   Prototype surface — round 2.
   Corrected brief: the first screen must establish identity, keep the
   CV's substance reachable, and give direct access to the projects,
   all without scrolling. Round 1 failed the wayfinding test.
   Tokens copied from public/static/style.css so variants look native.
   --------------------------------------------------------------- */
:root {
  --bg: #0E1116;
  --panel: #151A21;
  --panel-2: #1B222B;
  --ink: #E8EAED;
  --ink-soft: #8A93A0;
  --line: #262E38;
  --accent: #F5A623;
  --accent-soft: rgba(245, 166, 35, 0.12);
  --accent-soft-strong: rgba(245, 166, 35, 0.24);
  --accent-2: #4FA8FF;
  --accent-2-soft: rgba(79, 168, 255, 0.13);
  --danger: #F2555F;
  --danger-soft: rgba(242, 85, 95, 0.12);
  --danger-soft-strong: rgba(242, 85, 95, 0.26);

  --font-display: 'Manrope', 'Segoe UI', sans-serif;
  --font-body: 'Work Sans', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
  --dur-press: 110ms;
  --dur-hover: 200ms;
  --dur-enter: 420ms;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

#stage { min-height: 100vh; }
a { text-decoration: none; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@keyframes protoIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes protoFade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Shared bits ---------- */
.p-identity { display: flex; align-items: center; gap: 0.9rem; }
.p-avatar {
  width: 54px; height: 54px; border-radius: 10px; object-fit: cover;
  box-shadow: 0 0 0 1px var(--line); flex-shrink: 0;
}
.p-name {
  font-family: var(--font-display); font-weight: 700; font-size: 1.22rem;
  letter-spacing: -0.018em; line-height: 1.15; margin: 0 0 0.15rem;
}
.p-role { font-family: var(--font-mono); font-size: 0.73rem; color: var(--accent); margin: 0; }

.proto-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: var(--font-mono); font-size: 0.75rem;
  color: var(--accent);
  border: 1px solid var(--accent-soft-strong); background: var(--accent-soft);
  border-radius: 6px; padding: 0.45rem 0.8rem;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background var(--dur-hover) var(--ease-out),
              border-color var(--dur-hover) var(--ease-out),
              transform var(--dur-press) var(--ease-out);
}
.proto-btn.ghost { color: var(--ink-soft); background: transparent; border-color: var(--line); }
.proto-btn.demo { color: var(--danger); border-color: var(--danger-soft-strong); background: var(--danger-soft); }
.proto-btn:active { transform: scale(0.97); }

.lang-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* =============================================================
   VARIANT 1 — Índice
   Axis: the hero IS the navigation. The whole first screen is a
   structured table of contents of the CV — every section visible,
   every project named, everything one click away.
   ============================================================= */
.v1 { min-height: 100vh; display: flex; flex-direction: column; padding: 2.8rem 3rem 7rem; }
.v1-head {
  display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
  padding-bottom: 1.6rem; border-bottom: 1px solid var(--line); margin-bottom: 0.4rem;
  animation: protoIn var(--dur-enter) var(--ease-out) both;
}
.v1-head .sp { flex: 1; min-width: 1rem; }
.v1-tagline {
  font-size: 0.93rem; color: var(--ink-soft); margin: 0.5rem 0 0; max-width: 62ch;
}
.v1-index { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 2.5rem; }
.v1-row {
  display: grid; grid-template-columns: 2.2rem 1fr auto;
  align-items: baseline; gap: 0 0.9rem;
  padding: 1.05rem 0.6rem 1.05rem 0;
  border-bottom: 1px solid var(--line);
  border-radius: 6px;
  animation: protoIn 380ms var(--ease-out) both;
  transition: background var(--dur-hover) var(--ease-out),
              padding-left var(--dur-hover) var(--ease-out);
}
.v1-index .v1-row:nth-child(1) { animation-delay: 50ms; }
.v1-index .v1-row:nth-child(2) { animation-delay: 95ms; }
.v1-index .v1-row:nth-child(3) { animation-delay: 140ms; }
.v1-index .v1-row:nth-child(4) { animation-delay: 185ms; }
.v1-index .v1-row:nth-child(5) { animation-delay: 230ms; }
.v1-index .v1-row:nth-child(6) { animation-delay: 275ms; }
.v1-num { font-family: var(--font-mono); font-size: 0.73rem; color: var(--accent); }
.v1-t {
  font-family: var(--font-display); font-weight: 700; font-size: 1.02rem;
  letter-spacing: -0.01em; transition: color var(--dur-hover) var(--ease-out);
}
.v1-sub {
  grid-column: 2; font-family: var(--font-mono); font-size: 0.72rem;
  color: var(--ink-soft); line-height: 1.7; margin-top: 0.2rem;
}
.v1-sub a { color: var(--ink-soft); border-bottom: 1px solid var(--line); }
.v1-count {
  font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.5rem;
}
.v1-foot {
  display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
  margin-top: 1.8rem; animation: protoIn 380ms var(--ease-out) both; animation-delay: 320ms;
}

/* =============================================================
   VARIANT 2 — Split
   Axis: spatial split. Pitch and wayfinding on the left, the actual
   project evidence on the right — both above the fold.
   ============================================================= */
/* The 1fr row makes the single grid row absorb the full min-height, so the
   left panel paints to the bottom instead of stopping at its content. */
.v2 { min-height: 100vh; display: grid; grid-template-columns: minmax(300px, 400px) 1fr; grid-template-rows: 1fr; }
.v2-left {
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 2.8rem 2.2rem; display: flex; flex-direction: column; gap: 1.5rem;
  animation: protoFade var(--dur-enter) var(--ease-out) both;
}
.v2-pitch {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(1.5rem, 2.3vw, 1.95rem); line-height: 1.14;
  letter-spacing: -0.025em; margin: 0;
}
.v2-pitch .hl { color: var(--accent); }
.v2-lead { font-size: 0.9rem; color: var(--ink-soft); margin: 0; }
.v2-nav { display: flex; flex-direction: column; gap: 0.1rem; margin-top: auto; }
.v2-nav a {
  font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft);
  padding: 0.42rem 0.5rem; border-radius: 5px; display: flex; gap: 0.5rem;
  transition: color var(--dur-hover) var(--ease-out),
              background var(--dur-hover) var(--ease-out);
}
.v2-nav a::before { content: "//"; color: var(--accent); opacity: 0.7; }
.v2-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.v2-right { padding: 2.8rem 2.5rem 7rem; overflow: hidden; }
.v2-eyebrow {
  font-family: var(--font-mono); font-size: 0.73rem; color: var(--accent-2);
  margin: 0 0 1.2rem;
}
.v2-cards { display: grid; gap: 0.9rem; }
.v2-card {
  background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent);
  border-radius: 9px; padding: 1.1rem 1.2rem;
  display: grid; grid-template-columns: 1fr auto; gap: 0.5rem 1rem; align-items: start;
  animation: protoIn 380ms var(--ease-out) both;
  transition: transform var(--dur-hover) var(--ease-out),
              box-shadow var(--dur-hover) var(--ease-out);
}
.v2-cards .v2-card:nth-child(1) { animation-delay: 60ms; }
.v2-cards .v2-card:nth-child(2) { animation-delay: 110ms; }
.v2-cards .v2-card:nth-child(3) { animation-delay: 160ms; }
.v2-cname { font-family: var(--font-mono); font-weight: 600; font-size: 0.9rem; margin: 0 0 0.3rem; }
.v2-cdesc { font-size: 0.86rem; color: var(--ink-soft); line-height: 1.5; margin: 0 0 0.6rem; }
.v2-cmeta {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: var(--font-mono); font-size: 0.71rem; color: var(--ink-soft);
}
.v2-clinks { display: flex; flex-direction: column; gap: 0.4rem; }

/* =============================================================
   VARIANT 3 — Expediente
   Axis: compressed dossier. The CV's first page — every section
   present in miniature, nothing pushed below the fold.
   ============================================================= */
.v3 { min-height: 100vh; padding: 2.6rem 3rem 7rem; }
.v3-head {
  display: flex; align-items: center; gap: 1.1rem; flex-wrap: wrap;
  padding-bottom: 1.3rem; border-bottom: 1px solid var(--line); margin-bottom: 1.5rem;
  animation: protoIn var(--dur-enter) var(--ease-out) both;
}
.v3-head .sp { flex: 1; min-width: 1rem; }
.v3-stack { display: flex; gap: 0.35rem; flex-wrap: wrap; }
.v3-tag {
  font-family: var(--font-mono); font-size: 0.71rem; color: var(--accent);
  border: 1px solid var(--accent-soft-strong); background: var(--accent-soft);
  padding: 0.18rem 0.45rem; border-radius: 4px;
}
.v3-cols { display: grid; grid-template-columns: 1.15fr 1fr 0.9fr; gap: 2rem; }
.v3-col { animation: protoIn 380ms var(--ease-out) both; }
.v3-cols .v3-col:nth-child(1) { animation-delay: 60ms; }
.v3-cols .v3-col:nth-child(2) { animation-delay: 110ms; }
.v3-cols .v3-col:nth-child(3) { animation-delay: 160ms; }
.v3-ch {
  display: flex; align-items: baseline; gap: 0.55rem;
  font-family: var(--font-mono); font-size: 0.69rem; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--ink-soft);
  padding-bottom: 0.6rem; margin-bottom: 0.3rem; border-bottom: 1px solid var(--line);
}
.v3-ch .n { color: var(--accent); }
.v3-ch .more { margin-left: auto; text-transform: none; letter-spacing: 0; color: var(--accent-2); }
.v3-e { display: block; padding: 0.68rem 0.5rem 0.68rem 0; border-bottom: 1px solid var(--line); border-radius: 5px;
        transition: background var(--dur-hover) var(--ease-out), padding-left var(--dur-hover) var(--ease-out); }
.v3-e:last-child { border-bottom: 0; }
.v3-e-top { display: flex; align-items: baseline; gap: 0.5rem; }
.v3-org { font-weight: 600; font-size: 0.89rem; }
.v3-when { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-soft); margin-left: auto; white-space: nowrap; }
.v3-what { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.45; margin: 0.12rem 0 0; }
.v3-now {
  font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); padding: 0.08rem 0.35rem; border-radius: 3px;
}
.v3-plinks { display: flex; gap: 0.35rem; margin-top: 0.45rem; }
.v3-plink {
  font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: 4px; padding: 0.12rem 0.4rem;
  transition: color var(--dur-hover) var(--ease-out), border-color var(--dur-hover) var(--ease-out);
}
.v3-plink.demo { color: var(--danger); border-color: var(--danger-soft-strong); }
.v3-foot { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.8rem;
           animation: protoIn 380ms var(--ease-out) both; animation-delay: 210ms; }

/* Hover gated — touch fires it on tap and leaves a stuck state. */
@media (hover: hover) and (pointer: fine) {
  .proto-btn:hover { background: var(--accent-soft-strong); border-color: var(--accent); }
  .proto-btn.ghost:hover { color: var(--ink); border-color: var(--ink-soft); }
  .proto-btn.demo:hover { background: var(--danger-soft-strong); border-color: var(--danger); }
  .v1-row:hover { background: var(--panel); padding-left: 0.6rem; }
  .v1-row:hover .v1-t { color: var(--accent); }
  .v1-sub a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .v2-nav a:hover { color: var(--ink); background: var(--panel-2); }
  .v2-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.3); }
  .v3-e:hover { background: var(--panel); padding-left: 0.5rem; }
  .v3-plink:hover { color: var(--ink); border-color: var(--ink-soft); }
  .v3-plink.demo:hover { color: var(--danger); border-color: var(--danger); }
}

@media (max-width: 1000px) {
  .v1-index { grid-template-columns: 1fr; }
  .v2 { grid-template-columns: 1fr; }
  .v2-left { border-right: 0; border-bottom: 1px solid var(--line); }
  .v3-cols { grid-template-columns: 1fr; gap: 1.6rem; }
  .v1, .v3 { padding: 2.2rem 1.4rem 7rem; }
  .v2-right { padding: 2.2rem 1.4rem 7rem; }
}

@media (prefers-reduced-motion: reduce) {
  .v1-head, .v1-row, .v1-foot, .v2-left, .v2-card, .v3-head, .v3-col, .v3-foot {
    animation: protoFade 200ms var(--ease-out) both;
  }
}

/* =============================================================
   PICKER — verbatim from PICKER.md. Harness chrome, not a contestant.
   ============================================================= */
.proto-picker {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px;
  border-radius: 999px; background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset,
              0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
.proto-picker-highlight {
  position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.12); will-change: transform;
}
.proto-picker[data-ready] .proto-picker-highlight {
  transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
              width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}
@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}
.proto-picker-item {
  position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px;
  border: 0; border-radius: 999px; background: transparent;
  color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer;
  transition: color 150ms ease-out;
}
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker-replay { padding: 0 10px; font-size: 14px; }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>
<body>

<div id="stage"></div>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Índice</button>
  <button class="proto-picker-item">Split</button>
  <button class="proto-picker-item">Expediente</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
/* Real data, pulled from the live site. Links point at the real page and
   the real repos — nothing here is a dead button. */
const SITE = '../../index.html';
const CV = '../../static/cv-gonzalo-martinez-berzal.pdf';
const MAIL = 'mailto:gonzalogmb@gmail.com';
const LINKEDIN = 'https://www.linkedin.com/in/gonzalo-mart%C3%ADnez-berzal-003298227/';

const IDENTITY = `
  <div class="p-identity">
    <img class="p-avatar" src="avatar.jpg" alt="Gonzalo Martínez Berzal">
    <div>
      <h1 class="p-name">Gonzalo Martínez Berzal</h1>
      <p class="p-role">Data Analyst / Data Engineer · Madrid, España</p>
    </div>
  </div>`;

const PROJECTS = [
  { name: 'house-radar', lang: 'Python', color: 'var(--accent)',
    desc: 'Backend en FastAPI que scrapea portales inmobiliarios a diario, guarda el histórico de precio de cada anuncio y destaca bajadas.',
    demo: 'https://radar.gonzalomartinezberzal.com',
    repo: 'https://github.com/gonzalogmb/house-radar' },
  { name: 'market-analysis', lang: 'JavaScript', color: 'var(--accent-2)',
    desc: 'Herramienta para obtener y analizar datos de mercado de Yahoo Finance, con panel de visualización.',
    demo: 'https://market.gonzalomartinezberzal.com',
    repo: 'https://github.com/gonzalogmb/market-analysis' },
  { name: 'portfolio-web', lang: 'HTML', color: 'var(--accent)',
    desc: 'Servidor HTTP en Python sin dependencias (solo librería estándar) que construye y sirve este portfolio.',
    demo: null,
    repo: 'https://github.com/gonzalogmb/portfolio-web' }
];

/* ---------- Variant 1 — Índice ---------- */
function v1Render() {
  const rows = [
    { n: '01', t: 'Resumen', c: '', sub: '3+ años construyendo pipelines en PySpark sobre AWS y GCP para banca.', href: SITE + '#summary' },
    { n: '02', t: 'Experiencia', c: '4', sub: 'NFQ Advisory (BBVA) · Ernst &amp; Young · Optiva Media', href: SITE + '#experience' },
    { n: '03', t: 'Skills', c: '19', sub: 'PySpark · AWS · GCP · Python · LLMs · Databricks · Agile', href: SITE + '#skills' },
    { n: '04', t: 'Proyectos', c: '3',
      sub: PROJECTS.map(p => `<a href="${p.repo}" target="_blank" rel="noopener">${p.name}</a>`).join(' · '),
      href: SITE + '#projects' },
    { n: '05', t: 'Formación', c: '2', sub: 'Máster en Data Science e IA · Grado en Ingeniería Informática', href: SITE + '#education' },
    { n: '06', t: 'Certificaciones', c: '2', sub: 'AWS Certified Cloud Practitioner · Azure Databricks Fundamentals', href: SITE + '#certifications' }
  // Rows are divs, not anchors: the Proyectos row carries its own links and
  // nested <a> is invalid HTML — the browser closes the outer one and the
  // grid falls apart. The title is the link instead.
  ].map(r => `
    <div class="v1-row">
      <span class="v1-num">${r.n}</span>
      <a class="v1-t" href="${r.href}">${r.t}</a>
      ${r.c ? `<span class="v1-count">${r.c}</span>` : '<span></span>'}
      <span class="v1-sub">${r.sub}</span>
    </div>`).join('');

  return `
    <div class="v1">
      <div class="v1-head">
        ${IDENTITY}
        <span class="sp"></span>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
          <a class="proto-btn" href="${CV}" download>↓ CV</a>
          <a class="proto-btn ghost" href="${LINKEDIN}" target="_blank" rel="noopener">LinkedIn ↗</a>
        </div>
      </div>
      <p class="v1-tagline">Pipelines de datos que aguantan en producción. Tres años en banca, NLP y modelos de lenguaje, migraciones cloud a gran escala.</p>
      <div class="v1-index">${rows}</div>
      <div class="v1-foot">
        <a class="proto-btn ghost" href="${MAIL}">gonzalogmb@gmail.com</a>
        <a class="proto-btn ghost" href="tel:+34691625373">+34 691 62 53 73</a>
      </div>
    </div>`;
}

/* ---------- Variant 2 — Split ---------- */
function v2Render() {
  const nav = ['summary:resumen','experience:experiencia','skills:skills','projects:proyectos','education:formación','certifications:certificaciones']
    .map(s => { const [id, label] = s.split(':'); return `<a href="${SITE}#${id}">${label}</a>`; }).join('');

  const cards = PROJECTS.map(p => `
    <div class="v2-card">
      <div>
        <p class="v2-cname">${p.name}</p>
        <p class="v2-cdesc">${p.desc}</p>
        <span class="v2-cmeta"><i class="lang-dot" style="background:${p.color}"></i>${p.lang}</span>
      </div>
      <div class="v2-clinks">
        ${p.demo ? `<a class="proto-btn demo" href="${p.demo}" target="_blank" rel="noopener">Demo ↗</a>` : ''}
        <a class="proto-btn ghost" href="${p.repo}" target="_blank" rel="noopener">GitHub ↗</a>
      </div>
    </div>`).join('');

  return `
    <div class="v2">
      <aside class="v2-left">
        ${IDENTITY}
        <h2 class="v2-pitch">Pipelines de datos que <span class="hl">aguantan en producción</span>.</h2>
        <p class="v2-lead">3+ años en PySpark sobre AWS y GCP para grandes instituciones financieras. Máster en Data Science e IA · AWS Certified.</p>

/* ---------- Wiring (behaviour contract from PICKER.md) ---------- */
const variants = [v1Render, v2Render, v3Render];

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
